name: ci

on:
  push:
    branches: ["master", "main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=news_claws.domain --cov-branch --cov-fail-under=85
      - run: python -m compileall -q apps/analysis_api
      - name: Verify migrations
        env:
          APP_ENV: test
          ADMIN_TOKEN: ci-test-token
          DATABASE_URL: sqlite:///./data/ci.db
          SEED_DEMO: "false"
        run: python -m alembic upgrade head
      - run: docker build -f apps/analysis_api/Dockerfile -t news-claws:ci .

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pip_audit
