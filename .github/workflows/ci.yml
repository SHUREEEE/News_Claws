name: ci

on:
  push:
    branches: ["master", "main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -W error --cov=news_claws.domain --cov-branch --cov-fail-under=85
      - run: python -m compileall -q apps/analysis_api
      - run: node --check apps/analysis_api/news_claws/static/app.js
      - name: Verify migrations
        env:
          APP_ENV: test
          ADMIN_TOKEN: ci-test-token
          DATABASE_URL: sqlite:///./data/ci.db
          SEED_DEMO: "false"
        run: python -m alembic upgrade head
      - run: docker build -f apps/analysis_api/Dockerfile -t news-claws:ci .
      - name: Verify non-root backup mountpoint
        run: >-
          docker run --rm --entrypoint python news-claws:ci -c
          "import os; assert os.getuid() != 0; assert os.access('/data', os.W_OK);
          assert os.access('/backups', os.W_OK)"

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pip_audit
