name: news-claws

services:
  analysis-api:
    build:
      context: .
      dockerfile: apps/analysis_api/Dockerfile
    env_file:
      - .env.production
    expose:
      - "8000"
    volumes:
      - analysis-data:/data
      - analysis-backups:/backups
      - ./config:/app/config:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  caddy:
    image: caddy:2.10.2-alpine
    env_file:
      - .env.production
    depends_on:
      analysis-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  analysis-data:
  analysis-backups:
  caddy-data:
  caddy-config:
