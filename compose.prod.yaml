name: news-claws

services:
  analysis-api:
    image: "${NEWS_CLAWS_IMAGE:?NEWS_CLAWS_IMAGE is required}:${NEWS_CLAWS_IMAGE_TAG:?NEWS_CLAWS_IMAGE_TAG is required}"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      TRENDRADAR_MCP_URL: ${TRENDRADAR_MCP_URL:-http://trendradar-mcp:3333/mcp}
      TRENDRADAR_ENABLED: ${TRENDRADAR_ENABLED:-false}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_MODEL: ${LLM_MODEL:-rules-v1}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
      LLM_PER_EVENT_BUDGET: ${LLM_PER_EVENT_BUDGET:-0.50}
      LLM_INPUT_COST_PER_MILLION: ${LLM_INPUT_COST_PER_MILLION:-0}
      LLM_OUTPUT_COST_PER_MILLION: ${LLM_OUTPUT_COST_PER_MILLION:-0}
      NEWS_PLEASE_DISCOVERY_SOURCE_IDS: ${NEWS_PLEASE_DISCOVERY_SOURCE_IDS:-}
      DAILY_LLM_BUDGET: ${DAILY_LLM_BUDGET:-5.00}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}
      SEED_DEMO: ${SEED_DEMO:?SEED_DEMO is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-900}
      SCHEDULER_MAX_ITEMS: ${SCHEDULER_MAX_ITEMS:-20}
      OUTBOUND_USER_AGENT: ${OUTBOUND_USER_AGENT:?OUTBOUND_USER_AGENT is required}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-100}
    expose:
      - "8000"
    volumes:
      - analysis-data:/data
      - analysis-backups:/backups
      - ./config:/app/config:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER is required}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH is required}
    depends_on:
      analysis-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  analysis-data:
  analysis-backups:
  caddy-data:
  caddy-config:
